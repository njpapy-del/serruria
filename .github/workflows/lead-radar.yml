# Lead Radar — exécution planifiée sur les serveurs GitHub (ordinateur éteint OK).
# Dépôt public : les journaux sont publics. L'agent n'y écrit que des compteurs
# et des codes d'erreur ; les prospects ne partent que par e-mail.
name: Lead Radar

on:
  schedule:
    # Toutes les heures à la minute 7 (UTC). Mesuré le 2026-10-16 : avec */30,
    # GitHub n'a lancé que 2 passages en 3 h (écart 164 min). Les tâches
    # planifiées sont « au mieux » : elles peuvent être retardées ou sautées.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [assiste, surveillance, test, resend-check, gsc-report]
        default: assiste

permissions:
  contents: read

concurrency:
  group: lead-radar
  cancel-in-progress: false

jobs:
  radar:
    # Une fois le serveur dédié actif, couper la planification GitHub (sinon deux
    # robots avec deux états = alertes en double) : variable de dépôt
    # RADAR_GITHUB_SCHEDULE=off. Les lancements manuels restent possibles.
    if: github.event_name != 'schedule' || vars.RADAR_GITHUB_SCHEDULE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du moteur de qualification
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # État sans donnée personnelle (empreintes SHA-256 + compteurs uniquement).
      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: agent/.state
          key: lead-radar-state-${{ github.run_id }}
          restore-keys: lead-radar-state-

      - name: Lancer l'agent
        working-directory: agent
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_RADAR_SENDER_EMAIL: ${{ secrets.LEAD_RADAR_SENDER_EMAIL }}
          LEAD_RADAR_NOTIFICATION_EMAIL: ${{ secrets.LEAD_RADAR_NOTIFICATION_EMAIL }}
          RADAR_RSS_FEEDS: ${{ secrets.RADAR_RSS_FEEDS }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          RADAR_INGEST_URL: ${{ secrets.RADAR_INGEST_URL }}
          RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          # Source payante (Brave) autorisée uniquement lors des passages planifiés.
          RADAR_ALLOW_PAID: ${{ github.event_name == 'schedule' }}
        run: python3 -m lead_radar_agent --mode "${{ inputs.mode || 'assiste' }}"

      - name: Sauvegarder l'état
        if: always() && hashFiles('agent/.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: agent/.state
          key: lead-radar-state-${{ github.run_id }}
